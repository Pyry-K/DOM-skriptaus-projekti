<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do Randomizer</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Iconi nettisivulle -->
    <link
      rel="icon"
      type="image/x-icon"
      href="img\icon.png"
    />
    <script src="js/script.js" defer></script>
    <script src="js/skins.js" defer></script>
</head>
<body>

    <header>
        <h1>To-Do Randomizer</h1>
    </header>

    <main>
        <!-- Nykyinen kortti osio -->
        <section id="home">
            <h2>Can't decide what to do? We can sort that out.</h2>
            <br>
            <div class = "form-box">
                <b id="nykyinenKortti"></b>
            </div>
            <button id = "removeButton" class= "remove-button">
                Remove from the list
            </button>
            <!-- Kaikki kortit eli tehtävät yhteensä -->
            <h3 id="total">Total items in list: 0</h3>
            <br>
        <!-- Noppa osio -->
            <h2>Click dice to randomize:</h2>
            <div class="die-box" id="die-box">
                <div class="dice">
                    <!-- Nopan muoto tehty svg:llä eli piirretty pisteiden kautta. Kokeiltiin myös CSS kautta clip-path, mutta muotoa ei voinut muokata yhtä laajasti. -->
                    <svg viewBox="0 0 300 270" width="300">
                        <polygon points="150,10 270,75 270,195 150,260 30,195 30,75" fill="#1E6C9A" stroke="#FFFFFF" stroke-width="1"/>
                        <polygon points="150,10 150,65 30,75" fill="#4ACBEE" stroke="#FFFFFF" stroke-width="1"/>
                        <polygon points="150,10 270,75 150,65" fill="#47C6E9" stroke="#FFFFFF" stroke-width="1"/>
                        <polygon points="30,75 90,195 30,195" fill="#45C1E5" stroke="#FFFFFF" stroke-width="1"/>
                        <polygon points="30,75 150,65 90,195" fill="#3CAED4" stroke="#FFFFFF" stroke-width="1"/>
                        <polygon points="150,65 90,195 210,195" fill="#36A0C8" stroke="#FFFFFF" stroke-width="1"/>
                        <polygon points="150,65 270,75 210,195" fill="#3298C1" stroke="#FFFFFF" stroke-width="1"/>
                        <polygon points="30,195 90,195 150,260" fill="#2C8BB5" stroke="#FFFFFF" stroke-width="1"/>
                        <polygon points="90,195 210,195 150,260" fill="#267DA9" stroke="#FFFFFF" stroke-width="1"/>
                        <polygon points="210,195 270,195 150,260" fill="#2274A1" stroke="#FFFFFF" stroke-width="1"/>
                    </svg>
                    <button class= "roll" id="roll" type="button">
                        <b id="noppaTxT">Click to Roll</b>
                    </button>
                </div>
            </div>
        </section>
        <!-- Skini muokkaus osio -->
        <section id="customize">
            <h2>Customization</h2>
            <!-- Teema menun voi ottaa näkyviin napista -->
            <button class= "customizationToggle" id="customizationToggle" type="button">
                Customize
            </button>
            <div class= "customizationMenu" id="customizationMenu" hidden>
                <!-- Taustan värinvaihto -->
                <label for="backgroundColor">Background</label>
                <select class= "defMenu" id="backgroundColor">
                    <option value="#1E6C9A">Azure</option>
                    <option value="#302F6C">Twilight</option>
                    <option value="#1B2C0B">Wise Mystical Tree</option>
                    <option value="#EDEDED">Snow White</option>
                    <option value="#944ABD">Wonderland</option>
                    <option value="#3A4C64">Red Grave</option>
                    <option value="#4F0300">RPG</option>
                </select>
                <!-- Nopan värinvaihto -->
                <label for="diceColor">Dice</label>
                <select class= "defMenu" id="diceColor">
                    <option value="blue">Azure</option>
                    <option value="purple">Twilight</option>
                    <option value="green">Wise Mystical Tree</option>
                    <option value="gold">Shining Honour</option>
                    <option value="silver">The Artifact</option>
                    <option value="dmc">Devil Sparda</option>
                    <option value="cyber">Neuro Die</option>
                    <option value="Girlypop">Girlypop</option>
                    <option value="Cookie">Cookie</option>
                    <option value="Lex">Lex</option>
                    <option value="Disco">Disco</option>
                    <option value="MostWanted">Most Wanted</option>
                </select>
                <!-- Boxien taustan värinvaihto -->
                <label for="boxColor">Box</label>
                <select class= "defMenu" id="boxColor">
                    <option value="#36A0C8">Azure</option>
                    <option value="#504BB7">Twilight</option>
                    <option value="#939060">Wise Mystical Tree</option>
                    <option value="#B1B2B4">Snow White</option>
                    <option value="#E166B8">Wonderland</option>
                    <option value="#99A9CD">Red Grave</option>
                    <option value="#FABC43">RPG</option>
                </select>
                <!-- Tekstin värinvaihto -->
                <label for="textColor">Text</label>
                <select class= "defMenu" id="textColor">
                    <option value="#EFFFFF">Azure</option>
                    <option value="#C2FFFE">Twilight</option>
                    <option value="#D3FFBB">Wise Mystical Tree</option>
                    <option value="#BD262B">Snow White</option>
                    <option value="#DABD18">Wonderland</option>
                    <option value="#5E0906">Red Grave</option>
                    <option value="#F6F6CC">RPG</option>
                </select>
                <!-- Eri värikombinaatioita on yhteensä 4116 -->
                <br>
            </div>
        </section>
        <!-- Tehtävien lisäys osio -->
        <section id="card">
            <h2>Add things To-Do</h2>
            <div class="form-box">
                <!-- Lomake, jolla voit lisätä kortteja -->
                <form id="korttiForm">
                    <label for="kortti">Give a To-Do:</label><br>
                    <input class="defmenu" id="korttiInput" type="text" required>
                    <input class="defMenu" id="submitBtn" type="submit" value="Submit">
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>2026 Pyry & Valtteri</p>
    </footer>
</body>
</html>
