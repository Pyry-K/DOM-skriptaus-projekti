
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>

    <header>
        <h1>Tehtävä arpoja</h1>
    </header>

    <main>
        <section id="home">
            <h2>Can't decide what to do? We can sort that out.</h2>
            <br>
            <!-- Tähän nykyinen tehtävä, jos tehtäviä ei ole, about teksti "Aloitetaan lissämällä ensin tehtäviä"-->
            <!--  Optimaalisesti siin ois (tarvittaessa) linkki alemmas, tohon tehtävä kohtaan-->
            <h2>*current card</h2>
            <!-- sellanen nuoli seuraavaan / taakseppäin-->
             <h2>*next card</h2>
            <br>
            <h2>Click here to randomise:</h2>
            <div class="die-box">
                <div class="dice">
                    <svg viewBox="0 0 300 270" width="300">
                        <polygon points="150,10 270,75 270,195 150,260 30,195 30,75" fill="#1E6C9A" stroke="#111827"/>
                        <polygon points="150,10 150,65 30,75" fill="#4ACBEE" stroke="#111827"/>
                        <polygon points="150,10 270,75 150,65" fill="#47C6E9" stroke="#111827"/>
                        <polygon points="30,75 90,195 30,195" fill="#45C1E5" stroke="#111827"/>
                        <polygon points="30,75 150,65 90,195" fill="#3CAED4" stroke="#111827"/>
                        <polygon points="150,65 90,195 210,195" fill="#36A0C8" stroke="#111827"/>
                        <polygon points="150,65 270,75 210,195" fill="#3298C1" stroke="#111827"/>
                        <polygon points="30,195 90,195 150,260" fill="#2C8BB5" stroke="#111827"/>
                        <polygon points="90,195 210,195 150,260" fill="#267DA9" stroke="#111827"/>
                        <polygon points="210,195 270,195 150,260" fill="#2274A1" stroke="#111827"/>
                    </svg>
                    <button id="button" type="button">
                        <b id="noppa-text">20</b>
                    </button>
                </div>
            </div>
        </section>
        <!-- Tähän lomake, jolla voit sitten lisätä kortteja -->
        <section id="lomake">
            <h2>Lisää tehtävät</h2>
            <div class="form-box">
                <form>
                    <label for="tehtava">Anna tehtävä:</label><br>
                    <input type="text" id="tehtava" name="tehtava"><br>
                    <input type="submit" value="Submit">
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>2026 My Website</p>
    </footer>

</body>
</html>
